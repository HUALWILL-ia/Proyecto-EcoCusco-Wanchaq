<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración de seguridad — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="icon" type="image/png" href="../assets/logos/Logo_solo_hoja.png">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <button class="icon-btn sidebar-toggle" id="btnSidebarToggle" aria-label="Abrir menú"><i class="ph ph-list" aria-hidden="true"></i></button>
        <div class="topbar-title">
          <h1>Configuración de seguridad</h1>
          <span>Políticas de acceso para el personal municipal</span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="alert alert-warning" id="avisoPasswordTemporal" style="display:none; margin-bottom:var(--space-5);">
        <span><i class="ph ph-shield-check" aria-hidden="true"></i></span>
        <div>
          <strong>Sigues usando una contraseña temporal.</strong>
          <p class="mb-0">Por seguridad, <a href="#formPasswordAdmin">cámbiala ahora</a> en la sección "Cambiar mi contraseña".</p>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="stack">
          <div class="card">
            <div class="card-header"><h2>Política de acceso</h2></div>
            <div class="form-group">
              <div class="form-check">
                <input type="checkbox" id="obligar2FA" checked disabled>
                <label for="obligar2FA">Exigir verificación en dos pasos (2FA) para operadores y administradores.</label>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="expiracionCodigo">Expiración del código 2FA</label>
              <select id="expiracionCodigo" class="form-control">
                <option value="5">5 minutos (recomendado)</option>
                <option value="10">10 minutos</option>
                <option value="15">15 minutos</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="tiempoSesion">Cierre de sesión por inactividad</label>
              <select id="tiempoSesion" class="form-control">
                <option value="15">15 minutos</option>
                <option value="30" selected>30 minutos</option>
                <option value="60">60 minutos</option>
              </select>
            </div>
            <button class="btn btn-primary" id="btnGuardarPolitica">Guardar política</button>
          </div>

          <div class="card">
            <div class="card-header"><h2>Cambiar mi contraseña</h2></div>
            <form id="formPasswordAdmin" novalidate>
              <div class="form-group">
                <label class="form-label" for="passwordActual">Contraseña actual <span class="required">*</span></label>
                <input type="password" id="passwordActual" class="form-control">
                <div class="form-error" id="errorPasswordActual"></div>
              </div>
              <div class="dashboard-grid" style="grid-template-columns:1fr 1fr; margin-top:0;">
                <div class="form-group">
                  <label class="form-label" for="passwordNueva">Nueva contraseña <span class="required">*</span></label>
                  <input type="password" id="passwordNueva" class="form-control">
                  <div class="form-error" id="errorPasswordNueva"></div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="passwordConfirmar">Confirmar <span class="required">*</span></label>
                  <input type="password" id="passwordConfirmar" class="form-control">
                  <div class="form-error" id="errorPasswordConfirmar"></div>
                </div>
              </div>
              <button type="submit" class="btn btn-secondary">Actualizar contraseña</button>
            </form>
          </div>
        </div>

        <div class="stack">
          <div class="card">
            <div class="card-header"><h3 class="mb-0">Mi cuenta</h3></div>
            <div class="flex items-center gap-3">
              <div class="avatar-lg" id="avatarAdmin"></div>
              <div>
                <strong id="nombreAdmin"></strong>
                <p class="text-muted mb-0" id="cargoAdmin"></p>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3 class="mb-0">Actividad de acceso reciente</h3></div>
            <ul class="feed-list" id="feedAccesos"></ul>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/mocks/zonas.mock.js"></script>
<script src="../js/mocks/usuarios.mock.js"></script>
<script src="../js/mocks/residuos.mock.js"></script>
<script src="../js/mocks/camiones.mock.js"></script>
<script src="../js/mocks/rutas.mock.js"></script>
<script src="../js/mocks/incidencias.mock.js"></script>
<script src="../js/mocks/notificaciones.mock.js"></script>
<script src="../js/utils/api.js"></script>
<script src="../js/utils/storage.js"></script>
<script src="../js/utils/validaciones.js"></script>
<script src="../js/utils/auth-simulado.js"></script>
<script src="../js/utils/ui.js"></script>
<script src="../js/pages/admin-configuracion-seguridad.js"></script>
</body>
</html>
