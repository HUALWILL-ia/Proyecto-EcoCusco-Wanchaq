<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incidencias — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="icon" type="image/png" href="../assets/logos/Logo_solo_hoja.png">
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <button class="icon-btn sidebar-toggle" id="btnSidebarToggle" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
          <h1>Gestión de incidencias</h1>
          <span>Reportes de ciudadanos y operadores de la flota municipal</span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="card">
        <div class="table-toolbar">
          <div class="table-filters">
            <select id="filtroEstado" class="form-control" style="width:170px;">
              <option value="">Todos los estados</option>
              <option value="pendiente">Pendiente</option>
              <option value="en_atencion">En atención</option>
              <option value="resuelta">Resuelta</option>
            </select>
            <select id="filtroPrioridad" class="form-control" style="width:170px;">
              <option value="">Toda prioridad</option>
              <option value="alta">Alta</option>
              <option value="media">Media</option>
              <option value="baja">Baja</option>
            </select>
            <select id="filtroRolReporta" class="form-control" style="width:170px;">
              <option value="">Ciudadano y operador</option>
              <option value="ciudadano">Ciudadano</option>
              <option value="operador">Operador</option>
            </select>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr><th>ID</th><th>Tipo</th><th>Zona</th><th>Reportado por</th><th>Prioridad</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaIncidenciasAdmin"></tbody>
          </table>
        </div>
        <div class="pagination" id="paginacionIncidencias"></div>
      </div>
    </main>
  </div>
</div>

<!-- Modal de detalle / cambio de estado -->
<div class="modal-overlay" id="modalDetalleIncidencia">
  <div class="modal">
    <div class="modal-header">
      <h3>Detalle de incidencia</h3>
      <button class="modal-close" onclick="cerrarModal('modalDetalleIncidencia')">&times;</button>
    </div>
    <div id="detalleIncidenciaContenido"></div>
    <div class="form-group mt-3">
      <label class="form-label" for="nuevoEstadoIncidencia">Actualizar estado</label>
      <select id="nuevoEstadoIncidencia" class="form-control">
        <option value="pendiente">Pendiente</option>
        <option value="en_atencion">En atención</option>
        <option value="resuelta">Resuelta</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="cerrarModal('modalDetalleIncidencia')">Cerrar</button>
      <button class="btn btn-primary" id="btnGuardarEstadoIncidencia">Guardar</button>
    </div>
  </div>
</div>

<script src="../js/mocks/zonas.mock.js"></script>
<script src="../js/mocks/usuarios.mock.js"></script>
<script src="../js/mocks/residuos.mock.js"></script>
<script src="../js/mocks/camiones.mock.js"></script>
<script src="../js/mocks/rutas.mock.js"></script>
<script src="../js/mocks/incidencias.mock.js"></script>
<script src="../js/mocks/notificaciones.mock.js"></script>
<script src="../js/utils/api.js"></script>
<script src="../js/utils/storage.js"></script>
<script src="../js/utils/validaciones.js"></script>
<script src="../js/utils/auth-simulado.js"></script>
<script src="../js/utils/ui.js"></script>
<script src="../js/pages/admin-incidencias.js"></script>
</body>
</html>
