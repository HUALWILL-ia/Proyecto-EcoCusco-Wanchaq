<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutas — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="icon" type="image/png" href="../../assets/logos/Logo_solo_hoja.png">
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <button class="icon-btn sidebar-toggle" id="btnSidebarToggle" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
          <h1>Rutas de recolección</h1>
          <span>Planificación y asignación de rutas por zona</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="btnNuevaRuta">+ Nueva ruta</button>
      </div>
    </header>

    <main class="page-content">
      <div class="stack" id="listaRutasAdmin"></div>
    </main>
  </div>
</div>

<!-- Modal crear/editar ruta -->
<div class="modal-overlay" id="modalRuta">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <h3 id="tituloModalRuta">Nueva ruta</h3>
      <button class="modal-close" onclick="cerrarModal('modalRuta')">&times;</button>
    </div>
    <form id="formRuta" novalidate>
      <input type="hidden" id="rutaId">
      <div class="form-group">
        <label class="form-label" for="nombreRuta">Nombre de la ruta <span class="required">*</span></label>
        <input type="text" id="nombreRuta" class="form-control" placeholder="Ej. Ruta Marcavalle - Matutina">
        <div class="form-error" id="errorNombreRuta"></div>
      </div>
      <div class="dashboard-grid" style="grid-template-columns:1fr 1fr; margin-top:0;">
        <div class="form-group">
          <label class="form-label" for="zonaRuta">Zona</label>
          <select id="zonaRuta" class="form-control"></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="turnoRuta">Turno</label>
          <input type="text" id="turnoRuta" class="form-control" placeholder="Ej. 07:00 - 09:00">
        </div>
      </div>
      <div class="dashboard-grid" style="grid-template-columns:1fr 1fr; margin-top:0;">
        <div class="form-group">
          <label class="form-label" for="camionRuta">Camión</label>
          <select id="camionRuta" class="form-control"><option value="">Sin asignar</option></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="operadorRuta">Operador</label>
          <select id="operadorRuta" class="form-control"><option value="">Sin asignar</option></select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="puntosRuta">Puntos de recolección (uno por línea) <span class="required">*</span></label>
        <textarea id="puntosRuta" class="form-control" rows="4" placeholder="Av. Los Incas cuadra 1&#10;Plaza Túpac Amaru"></textarea>
        <div class="form-error" id="errorPuntosRuta"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalRuta')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar ruta</button>
      </div>
    </form>
  </div>
</div>

<script src="../../js/mocks/zonas.mock.js"></script>
<script src="../../js/mocks/usuarios.mock.js"></script>
<script src="../../js/mocks/residuos.mock.js"></script>
<script src="../../js/mocks/camiones.mock.js"></script>
<script src="../../js/mocks/rutas.mock.js"></script>
<script src="../../js/mocks/incidencias.mock.js"></script>
<script src="../../js/mocks/notificaciones.mock.js"></script>
<script src="../../js/utils/api.js"></script>
<script src="../../js/utils/storage.js"></script>
<script src="../../js/utils/validaciones.js"></script>
<script src="../../js/utils/auth-simulado.js"></script>
<script src="../../js/utils/ui.js"></script>
<script src="../../js/pages/admin-rutas.js"></script>
</body>
</html>
