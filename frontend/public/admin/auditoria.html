<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="icon" type="image/png" href="../../assets/logos/Logo_solo_hoja.png">
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <button class="icon-btn sidebar-toggle" id="btnSidebarToggle" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
          <h1>Auditoría del sistema</h1>
          <span>Historial de cambios realizados en el sistema</span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="alert alert-info" style="font-size:var(--fs-sm);">
        <p class="mb-0">Este registro se genera automáticamente y es de solo lectura: no puede editarse desde la aplicación.</p>
      </div>

      <div class="card">
        <div class="table-toolbar">
          <div class="table-filters">
            <select id="filtroTabla" class="form-control" style="width:200px;">
              <option value="">Todas las tablas</option>
            </select>
            <input type="date" id="filtroDesde" class="form-control" style="width:170px;" title="Desde">
            <input type="date" id="filtroHasta" class="form-control" style="width:170px;" title="Hasta">
          </div>
        </div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr><th>Fecha</th><th>Tabla</th><th>Operación</th><th>Registro</th><th>Usuario</th><th>Detalle</th></tr>
            </thead>
            <tbody id="tablaAuditoria"></tbody>
          </table>
        </div>
        <div class="pagination" id="paginacionAuditoria"></div>
      </div>
    </main>
  </div>
</div>

<!-- Modal de detalle JSON (antes/después) -->
<div class="modal-overlay" id="modalDetalleAuditoria">
  <div class="modal" style="max-width:640px;">
    <div class="modal-header">
      <h3 id="tituloDetalleAuditoria">Detalle del cambio</h3>
      <button class="modal-close" onclick="cerrarModal('modalDetalleAuditoria')">&times;</button>
    </div>
    <div class="dashboard-grid" style="grid-template-columns:1fr 1fr; margin-top:0;">
      <div>
        <div class="footer-title" style="color:var(--color-text-secondary);">Antes</div>
        <pre id="datosAnteriores" style="background:var(--color-surface-muted); border-radius:var(--radius-md); padding:var(--space-3); font-size:var(--fs-xs); max-height:320px; overflow:auto; white-space:pre-wrap;"></pre>
      </div>
      <div>
        <div class="footer-title" style="color:var(--color-text-secondary);">Después</div>
        <pre id="datosNuevos" style="background:var(--color-surface-muted); border-radius:var(--radius-md); padding:var(--space-3); font-size:var(--fs-xs); max-height:320px; overflow:auto; white-space:pre-wrap;"></pre>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="cerrarModal('modalDetalleAuditoria')">Cerrar</button>
    </div>
  </div>
</div>

<script src="../../js/mocks/zonas.mock.js"></script>
<script src="../../js/mocks/usuarios.mock.js"></script>
<script src="../../js/mocks/residuos.mock.js"></script>
<script src="../../js/mocks/camiones.mock.js"></script>
<script src="../../js/mocks/rutas.mock.js"></script>
<script src="../../js/mocks/incidencias.mock.js"></script>
<script src="../../js/mocks/notificaciones.mock.js"></script>
<script src="../../js/utils/api.js"></script>
<script src="../../js/utils/storage.js"></script>
<script src="../../js/utils/validaciones.js"></script>
<script src="../../js/utils/auth-simulado.js"></script>
<script src="../../js/utils/ui.js"></script>
<script src="../../js/pages/admin-auditoria.js"></script>
</body>
</html>
