<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zonas de recolección — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="icon" type="image/png" href="../../assets/logos/Logo_solo_hoja.png">
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <button class="icon-btn sidebar-toggle" id="btnSidebarToggle" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
          <h1>Zonas de recolección</h1>
          <span>Sectores y urbanizaciones cubiertas en el distrito de Wanchaq</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="btnNuevaZona">+ Nueva zona</button>
      </div>
    </header>

    <main class="page-content">
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr><th>Zona</th><th>Referencia</th><th>Horario</th><th>Residuo principal</th><th>Contenedores</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tablaZonas"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Modal crear/editar zona -->
<div class="modal-overlay" id="modalZona">
  <div class="modal">
    <div class="modal-header">
      <h3 id="tituloModalZona">Nueva zona</h3>
      <button class="modal-close" onclick="cerrarModal('modalZona')">&times;</button>
    </div>
    <form id="formZona" novalidate>
      <input type="hidden" id="zonaId">
      <div class="form-group">
        <label class="form-label" for="nombre">Nombre de la zona <span class="required">*</span></label>
        <input type="text" id="nombre" class="form-control" placeholder="Ej. Miravalle">
        <div class="form-error" id="errorNombre"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="referencia">Referencia <span class="required">*</span></label>
        <input type="text" id="referencia" class="form-control" placeholder="Ej. Av. Los Incas cuadra 3">
        <div class="form-error" id="errorReferencia"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="horario">Horario de recolección <span class="required">*</span></label>
        <input type="text" id="horario" class="form-control" placeholder="Ej. Lunes, Miércoles y Viernes — 07:00 a 09:00">
        <div class="form-error" id="errorHorario"></div>
      </div>
      <div class="dashboard-grid" style="grid-template-columns:1fr 1fr; margin-top:0;">
        <div class="form-group">
          <label class="form-label" for="tipoResiduoPrincipal">Residuo principal</label>
          <select id="tipoResiduoPrincipal" class="form-control">
            <option>Mixto</option>
            <option>Orgánico</option>
            <option>Reciclable</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="contenedores">N.º de contenedores</label>
          <input type="number" id="contenedores" class="form-control" min="0" value="0">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalZona')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar zona</button>
      </div>
    </form>
  </div>
</div>

<script src="../../js/mocks/zonas.mock.js"></script>
<script src="../../js/mocks/usuarios.mock.js"></script>
<script src="../../js/mocks/residuos.mock.js"></script>
<script src="../../js/mocks/camiones.mock.js"></script>
<script src="../../js/mocks/rutas.mock.js"></script>
<script src="../../js/mocks/incidencias.mock.js"></script>
<script src="../../js/mocks/notificaciones.mock.js"></script>
<script src="../../js/utils/api.js"></script>
<script src="../../js/utils/storage.js"></script>
<script src="../../js/utils/validaciones.js"></script>
<script src="../../js/utils/auth-simulado.js"></script>
<script src="../../js/utils/ui.js"></script>
<script src="../../js/pages/admin-zonas.js"></script>
</body>
</html>
