<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipos de residuo — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="icon" type="image/png" href="../../assets/logos/Logo_solo_hoja.png">
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <button class="icon-btn sidebar-toggle" id="btnSidebarToggle" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
          <h1>Tipos de residuo</h1>
          <span>Catálogo de clasificación de residuos sólidos</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="btnNuevoTipo">+ Nuevo tipo</button>
      </div>
    </header>

    <main class="page-content">
      <div class="features-grid" id="gridTipos"></div>
    </main>
  </div>
</div>

<!-- Modal crear/editar tipo de residuo -->
<div class="modal-overlay" id="modalTipo">
  <div class="modal">
    <div class="modal-header">
      <h3 id="tituloModalTipo">Nuevo tipo de residuo</h3>
      <button class="modal-close" onclick="cerrarModal('modalTipo')">&times;</button>
    </div>
    <form id="formTipo" novalidate>
      <input type="hidden" id="tipoId">
      <div class="form-group">
        <label class="form-label" for="nombreTipo">Nombre <span class="required">*</span></label>
        <input type="text" id="nombreTipo" class="form-control" placeholder="Ej. Orgánico">
        <div class="form-error" id="errorNombreTipo"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="descripcionTipo">Descripción <span class="required">*</span></label>
        <textarea id="descripcionTipo" class="form-control" rows="2"></textarea>
        <div class="form-error" id="errorDescripcionTipo"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="contenedorTipo">Contenedor recomendado</label>
        <input type="text" id="contenedorTipo" class="form-control" placeholder="Ej. Bolsa verde">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="cerrarModal('modalTipo')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="../../js/mocks/zonas.mock.js"></script>
<script src="../../js/mocks/usuarios.mock.js"></script>
<script src="../../js/mocks/residuos.mock.js"></script>
<script src="../../js/mocks/camiones.mock.js"></script>
<script src="../../js/mocks/rutas.mock.js"></script>
<script src="../../js/mocks/incidencias.mock.js"></script>
<script src="../../js/mocks/notificaciones.mock.js"></script>
<script src="../../js/utils/api.js"></script>
<script src="../../js/utils/storage.js"></script>
<script src="../../js/utils/validaciones.js"></script>
<script src="../../js/utils/auth-simulado.js"></script>
<script src="../../js/utils/ui.js"></script>
<script src="../../js/pages/admin-tipos-residuo.js"></script>
</body>
</html>
