<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportar incidencia — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="icon" type="image/png" href="../assets/logos/Logo_solo_hoja.png">
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <button class="icon-btn sidebar-toggle" id="btnSidebarToggle" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
          <h1>Reportar incidencia</h1>
          <span>Informa cualquier eventualidad durante tu ruta de recolección</span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="dashboard-grid">
        <div class="card">
          <form id="formIncidenciaOperador" novalidate>
            <div class="form-group">
              <label class="form-label" for="tipo">Tipo de incidencia <span class="required">*</span></label>
              <select id="tipo" class="form-control">
                <option value="">Selecciona un tipo...</option>
                <option>Vehículo obstruye ruta</option>
                <option>Residuos peligrosos mezclados</option>
                <option>Contenedor dañado</option>
                <option>Falla mecánica del camión</option>
                <option>Vía inaccesible</option>
                <option>Otro</option>
              </select>
              <div class="form-error" id="errorTipo"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="zona">Zona <span class="required">*</span></label>
              <select id="zona" class="form-control"></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="direccion">Dirección de referencia <span class="required">*</span></label>
              <input type="text" id="direccion" class="form-control" placeholder="Ej. Jr. Manco Cápac">
              <div class="form-error" id="errorDireccion"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="descripcion">Descripción <span class="required">*</span></label>
              <textarea id="descripcion" class="form-control" rows="4"></textarea>
              <div class="form-error" id="errorDescripcion"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="prioridad">Prioridad</label>
              <select id="prioridad" class="form-control">
                <option value="baja">Baja</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Fotografía (opcional)</label>
              <div id="zonaCargaFotoIncidencia"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="btnEnviar">
              <span id="btnEnviarTexto">Enviar reporte</span>
            </button>
          </form>
        </div>

        <div class="card">
          <div class="card-header"><h3 class="mb-0">Mis reportes recientes</h3></div>
          <ul class="feed-list" id="feedMisReportes"></ul>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/mocks/zonas.mock.js"></script>
<script src="../js/mocks/usuarios.mock.js"></script>
<script src="../js/mocks/residuos.mock.js"></script>
<script src="../js/mocks/camiones.mock.js"></script>
<script src="../js/mocks/rutas.mock.js"></script>
<script src="../js/mocks/incidencias.mock.js"></script>
<script src="../js/mocks/notificaciones.mock.js"></script>
<script src="../js/utils/api.js"></script>
<script src="../js/utils/storage.js"></script>
<script src="../js/utils/validaciones.js"></script>
<script src="../js/utils/auth-simulado.js"></script>
<script src="../js/utils/ui.js"></script>
<script src="../js/utils/uploadZone.js"></script>
<script src="../js/pages/operador-incidencias.js"></script>
</body>
</html>
