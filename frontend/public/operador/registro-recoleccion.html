<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar recolección — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="icon" type="image/png" href="../../assets/logos/Logo_solo_hoja.png">
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <button class="icon-btn sidebar-toggle" id="btnSidebarToggle" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
          <h1>Registrar recolección</h1>
          <span>Marca los puntos completados y registra el total recolectado</span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="dashboard-grid">
        <div class="card">
          <div class="card-header">
            <h2 class="mb-0">Ruta activa</h2>
          </div>
          <div id="checklistRuta">
            <div class="loading-overlay"><span class="spinner"></span> Cargando ruta...</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h2 class="mb-0">Registrar totales de la ruta</h2></div>
          <form id="formRecoleccion" novalidate>
            <div class="form-group">
              <label class="form-label" for="tipoResiduo">Tipo de residuo recolectado <span class="required">*</span></label>
              <select id="tipoResiduo" class="form-control"></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="kgRecolectados">Kilogramos recolectados (aprox.) <span class="required">*</span></label>
              <input type="number" id="kgRecolectados" class="form-control" min="1" placeholder="Ej. 350">
              <div class="form-error" id="errorKg"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="observaciones">Observaciones</label>
              <textarea id="observaciones" class="form-control" rows="3" placeholder="Notas adicionales (opcional)"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="btnRegistrar">Guardar registro</button>
          </form>
        </div>
      </div>

      <div class="card mt-4">
        <div class="card-header"><h3 class="mb-0">Historial de registros de hoy</h3></div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Hora</th><th>Ruta</th><th>Tipo</th><th>Kg</th></tr></thead>
            <tbody id="tablaHistorialHoy"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../../js/mocks/zonas.mock.js"></script>
<script src="../../js/mocks/usuarios.mock.js"></script>
<script src="../../js/mocks/residuos.mock.js"></script>
<script src="../../js/mocks/camiones.mock.js"></script>
<script src="../../js/mocks/rutas.mock.js"></script>
<script src="../../js/mocks/incidencias.mock.js"></script>
<script src="../../js/mocks/notificaciones.mock.js"></script>
<script src="../../js/utils/api.js"></script>
<script src="../../js/utils/storage.js"></script>
<script src="../../js/utils/validaciones.js"></script>
<script src="../../js/utils/auth-simulado.js"></script>
<script src="../../js/utils/ui.js"></script>
<script src="../../js/pages/operador-registro-recoleccion.js"></script>
</body>
</html>
