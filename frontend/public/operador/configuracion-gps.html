<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración GPS — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="icon" type="image/png" href="../../assets/logos/Logo_solo_hoja.png">
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <button class="icon-btn sidebar-toggle" id="btnSidebarToggle" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
          <h1>Configuración GPS</h1>
          <span>Ajusta cómo se transmite tu ubicación durante la jornada</span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="card" style="max-width:560px;">
        <form id="formConfigGps">
          <div class="form-group">
            <div class="form-check">
              <input type="checkbox" id="compartirUbicacion">
              <label for="compartirUbicacion">Compartir mi ubicación en tiempo real con la central municipal y los vecinos de mi zona.</label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="intervalo">Frecuencia de actualización</label>
            <select id="intervalo" class="form-control">
              <option value="5">Cada 5 segundos (alta precisión, más consumo de batería)</option>
              <option value="10">Cada 10 segundos (recomendado)</option>
              <option value="15">Cada 15 segundos</option>
              <option value="30">Cada 30 segundos (ahorro de batería)</option>
            </select>
            <div class="form-hint">Es el intervalo mínimo entre envíos reales al servidor; tu navegador puede detectar cambios de posición con más frecuencia.</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="precision">Precisión GPS</label>
            <select id="precision" class="form-control">
              <option value="alta">Alta (recomendada en zona urbana)</option>
              <option value="media">Media</option>
              <option value="baja">Baja (ahorro de batería)</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Guardar configuración</button>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="../../js/mocks/zonas.mock.js"></script>
<script src="../../js/mocks/usuarios.mock.js"></script>
<script src="../../js/mocks/residuos.mock.js"></script>
<script src="../../js/mocks/camiones.mock.js"></script>
<script src="../../js/mocks/rutas.mock.js"></script>
<script src="../../js/mocks/incidencias.mock.js"></script>
<script src="../../js/mocks/notificaciones.mock.js"></script>
<script src="../../js/utils/api.js"></script>
<script src="../../js/utils/storage.js"></script>
<script src="../../js/utils/validaciones.js"></script>
<script src="../../js/utils/auth-simulado.js"></script>
<script src="../../js/utils/ui.js"></script>
<script src="../../js/pages/operador-configuracion-gps.js"></script>
</body>
</html>
