<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incidencias — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="icon" type="image/png" href="../assets/logos/Logo_solo_hoja.png">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<nav class="navbar" id="navbar-ciudadano"></nav>

<main class="container" style="padding-top:var(--space-6); padding-bottom:var(--space-7);">
  <div class="topbar-title" style="margin-bottom:var(--space-5);">
    <h1>Incidencias</h1>
    <span>Reporta problemas de recolección y haz seguimiento a tus reportes</span>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" class="tab-btn active" id="tabBtnReportar" role="tab" aria-selected="true" data-tab="reportar"><i class="ph ph-note-pencil" aria-hidden="true"></i> Reportar nueva</button>
    <button type="button" class="tab-btn" id="tabBtnMisIncidencias" role="tab" aria-selected="false" data-tab="mis-incidencias"><i class="ph ph-clipboard-text" aria-hidden="true"></i> Mis incidencias</button>
  </div>

  <!-- Panel: Reportar nueva -->
  <section class="tab-panel active" id="panelReportar" role="tabpanel">
    <div class="card" style="max-width:680px;">
      <form id="formIncidencia" novalidate>
        <div class="form-group">
          <label class="form-label" for="tipo">Tipo de incidencia <span class="required">*</span></label>
          <select id="tipo" class="form-control">
            <option value="">Selecciona un tipo...</option>
            <option>Acumulación de residuos</option>
            <option>Contenedor dañado</option>
            <option>Vehículo obstruye ruta</option>
            <option>Residuos peligrosos mezclados</option>
            <option>Camión no pasó por la zona</option>
            <option>Otro</option>
          </select>
          <div class="form-error" id="errorTipo"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="zona">Zona <span class="required">*</span></label>
          <select id="zona" class="form-control"></select>
          <div class="form-error" id="errorZona"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="direccion">Dirección de referencia <span class="required">*</span></label>
          <input type="text" id="direccion" class="form-control" placeholder="Ej. Av. Los Incas cuadra 3">
          <div class="form-error" id="errorDireccion"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="descripcion">Descripción <span class="required">*</span></label>
          <textarea id="descripcion" class="form-control" rows="4" placeholder="Describe brevemente el problema..."></textarea>
          <div class="form-error" id="errorDescripcion"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Fotografía (opcional)</label>
          <div id="zonaCargaFotoIncidencia"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="btnEnviarIncidencia">
          <span id="btnEnviarIncidenciaTexto">Enviar reporte</span>
        </button>
      </form>
    </div>
  </section>

  <!-- Panel: Mis incidencias -->
  <section class="tab-panel" id="panelMisIncidencias" role="tabpanel">
    <div class="card">
      <div class="table-toolbar">
        <div class="table-filters">
          <select id="filtroEstado" class="form-control" style="width:180px;">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendiente</option>
            <option value="en_atencion">En atención</option>
            <option value="resuelta">Resuelta</option>
          </select>
        </div>
        <button type="button" class="btn btn-primary btn-sm" id="btnIrAReportar">+ Nuevo reporte</button>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr><th>ID</th><th>Tipo</th><th>Zona</th><th>Fecha</th><th>Estado</th></tr>
          </thead>
          <tbody id="tablaIncidencias"></tbody>
        </table>
      </div>
      <div class="pagination" id="paginacion"></div>
    </div>
  </section>
</main>

<!-- Modal de confirmación -->
<div class="modal-overlay" id="modalConfirmacion">
  <div class="modal text-center">
    <div class="modal-icon-success"><i class="ph-fill ph-check-circle" aria-hidden="true"></i></div>
    <h3>¡Reporte enviado!</h3>
    <p>Tu incidencia fue registrada y será atendida por el equipo de la Gerencia de Gestión Ambiental. Puedes hacer seguimiento desde <strong>Mis incidencias</strong>.</p>
    <div class="modal-actions" style="justify-content:center;">
      <button class="btn btn-primary" id="btnVerMisIncidencias">Ver mis incidencias</button>
      <button class="btn btn-secondary" onclick="cerrarModal('modalConfirmacion')">Cerrar</button>
    </div>
  </div>
</div>

<footer class="site-footer" id="footer-institucional"></footer>

<script src="../js/mocks/zonas.mock.js"></script>
<script src="../js/mocks/usuarios.mock.js"></script>
<script src="../js/mocks/residuos.mock.js"></script>
<script src="../js/mocks/camiones.mock.js"></script>
<script src="../js/mocks/rutas.mock.js"></script>
<script src="../js/mocks/incidencias.mock.js"></script>
<script src="../js/mocks/notificaciones.mock.js"></script>
<script src="../js/utils/api.js"></script>
<script src="../js/utils/storage.js"></script>
<script src="../js/utils/validaciones.js"></script>
<script src="../js/utils/auth-simulado.js"></script>
<script src="../js/utils/ui.js"></script>
<script src="../js/utils/uploadZone.js"></script>
<script src="../js/pages/ciudadano-incidencias.js"></script>
</body>
</html>
