<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="icon" type="image/png" href="../../assets/logos/Logo_solo_hoja.png">
</head>
<body>

<nav class="navbar" id="navbar-ciudadano"></nav>

<main class="container" style="padding-top:var(--space-6); padding-bottom:var(--space-7);">
  <div class="topbar-title" style="margin-bottom:var(--space-5);">
    <h1>Mi perfil</h1>
    <span>Datos personales del vecino de Wanchaq</span>
  </div>

  <div class="dashboard-grid">
    <div class="stack">
      <div class="card">
        <div class="card-header"><h2>Información personal</h2></div>
        <form id="formPerfil" novalidate>
          <div class="dashboard-grid" style="grid-template-columns:1fr 1fr; margin-top:0;">
            <div class="form-group">
              <label class="form-label" for="dni">DNI</label>
              <input type="text" id="dni" class="form-control" disabled>
            </div>
            <div class="form-group">
              <label class="form-label" for="correo">Correo electrónico</label>
              <input type="email" id="correo" class="form-control" disabled>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="telefono">Teléfono</label>
            <input type="text" id="telefono" class="form-control" placeholder="984 000 000">
          </div>
          <div class="form-group">
            <label class="form-label" for="zona">Zona de residencia</label>
            <select id="zona" class="form-control"></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="direccion">Dirección de referencia</label>
            <input type="text" id="direccion" class="form-control" placeholder="Ej. Urb. Manuel Prado C-4">
          </div>
          <button type="submit" class="btn btn-primary" id="btnGuardarPerfil">Guardar cambios</button>
        </form>
      </div>

      <div class="card">
        <div class="card-header"><h2>Cambiar contraseña</h2></div>
        <form id="formPassword" novalidate>
          <div class="form-group">
            <label class="form-label" for="passwordActual">Contraseña actual <span class="required">*</span></label>
            <input type="password" id="passwordActual" class="form-control">
            <div class="form-error" id="errorPasswordActual"></div>
          </div>
          <div class="dashboard-grid" style="grid-template-columns:1fr 1fr; margin-top:0;">
            <div class="form-group">
              <label class="form-label" for="passwordNueva">Nueva contraseña <span class="required">*</span></label>
              <input type="password" id="passwordNueva" class="form-control">
              <div class="form-error" id="errorPasswordNueva"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="passwordConfirmar">Confirmar nueva <span class="required">*</span></label>
              <input type="password" id="passwordConfirmar" class="form-control">
              <div class="form-error" id="errorPasswordConfirmar"></div>
            </div>
          </div>
          <button type="submit" class="btn btn-secondary" id="btnCambiarPassword">Actualizar contraseña</button>
        </form>
      </div>
    </div>

    <div class="stack">
      <div class="card text-center">
        <div class="avatar-lg" style="margin:0 auto var(--space-3);" id="avatarPerfil"></div>
        <h3 id="nombrePerfil"></h3>
        <p class="text-muted" id="rolPerfil"></p>
        <span class="badge badge-success" id="nivelPerfil"></span>
      </div>
      <div class="card">
        <div class="card-header"><h3 class="mb-0">Mi actividad</h3></div>
        <p class="mb-0">Kg reciclados: <strong id="kgPerfil">0</strong></p>
        <p>Miembro desde: <strong id="fechaRegistroPerfil">—</strong></p>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="footer-institucional"></footer>

<script src="../../js/mocks/zonas.mock.js"></script>
<script src="../../js/mocks/usuarios.mock.js"></script>
<script src="../../js/mocks/residuos.mock.js"></script>
<script src="../../js/mocks/camiones.mock.js"></script>
<script src="../../js/mocks/rutas.mock.js"></script>
<script src="../../js/mocks/incidencias.mock.js"></script>
<script src="../../js/mocks/notificaciones.mock.js"></script>
<script src="../../js/utils/api.js"></script>
<script src="../../js/utils/storage.js"></script>
<script src="../../js/utils/validaciones.js"></script>
<script src="../../js/utils/auth-simulado.js"></script>
<script src="../../js/utils/ui.js"></script>
<script src="../../js/pages/ciudadano-perfil.js"></script>
</body>
</html>
