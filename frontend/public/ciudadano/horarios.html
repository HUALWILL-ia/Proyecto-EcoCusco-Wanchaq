<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horarios de recolección — EcoRutas Wanchaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="icon" type="image/png" href="../assets/logos/Logo_solo_hoja.png">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<nav class="navbar" id="navbar-ciudadano"></nav>

<main class="container" style="padding-top:var(--space-6); padding-bottom:var(--space-7);">
  <div class="topbar-title" style="margin-bottom:var(--space-5);">
    <h1>Horarios de recolección</h1>
    <span>Consulta los días y horas de recolección por zona y tipo de residuo en Wanchaq</span>
  </div>

  <div class="card mt-4" id="miZonaCard"></div>

  <div class="card mt-4">
    <div class="card-header">
      <h2>Tipos de residuo y días recomendados</h2>
    </div>
    <div class="features-grid" id="tiposResiduoGrid"></div>
  </div>

  <div class="card mt-4">
    <div class="table-toolbar">
      <h2 class="mb-0">Todas las zonas de Wanchaq</h2>
      <div class="table-filters">
        <input type="text" class="form-control" id="filtroZona" placeholder="Buscar zona..." style="width:220px;">
      </div>
    </div>
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr><th>Zona</th><th>Referencia</th><th>Horario</th><th>Residuo principal</th></tr>
        </thead>
        <tbody id="tablaZonas"></tbody>
      </table>
    </div>
  </div>
</main>

<footer class="site-footer" id="footer-institucional"></footer>

<script src="../js/mocks/zonas.mock.js"></script>
<script src="../js/mocks/usuarios.mock.js"></script>
<script src="../js/mocks/residuos.mock.js"></script>
<script src="../js/mocks/camiones.mock.js"></script>
<script src="../js/mocks/rutas.mock.js"></script>
<script src="../js/mocks/incidencias.mock.js"></script>
<script src="../js/mocks/notificaciones.mock.js"></script>
<script src="../js/utils/api.js"></script>
<script src="../js/utils/storage.js"></script>
<script src="../js/utils/validaciones.js"></script>
<script src="../js/utils/auth-simulado.js"></script>
<script src="../js/utils/ui.js"></script>
<script src="../js/pages/ciudadano-horarios.js"></script>
</body>
</html>
